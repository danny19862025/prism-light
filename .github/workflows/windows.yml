name: Studio desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Qt system libraries (Linux)
        # PySide6's QtGui loads EGL/GL, fontconfig and xkbcommon even with the
        # offscreen platform; the Ubuntu runner image does not ship them, so
        # every GUI test failed to import (ImportError: libEGL.so.1).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Cache checksum-pinned downloads
        # OpenRGB comes from codeberg.org, which can stall; reuse verified
        # archives between runs (the fetch scripts re-check every SHA-256).
        uses: actions/cache@v4
        with:
          path: vendor/cache
          key: vendor-cache-${{ runner.os }}-${{ hashFiles('tools/fetch_openrgb.py') }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check Windows source launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: Run-PrismLight.cmd --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python build.py
      - name: Check packaged demo startup
        shell: python
        run: |
          import os, subprocess, sys
          env = dict(os.environ, QT_QPA_PLATFORM='offscreen')
          exe = 'dist/PrismLight/PrismLight.exe' if sys.platform == 'win32' else 'dist/PrismLight/PrismLight'
          subprocess.run([exe, '--smoke-test'], env=env, timeout=30, check=True)
      - name: Check bundled Linux hardware engine lifecycle
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, subprocess, tempfile
          env = dict(os.environ, QT_QPA_PLATFORM='offscreen')
          with tempfile.TemporaryDirectory() as config:
              subprocess.run(['dist/PrismLight/PrismLight', '--hardware-smoke-test', '--hardware-config', config], env=env, timeout=60, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: PrismLight-Studio-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
