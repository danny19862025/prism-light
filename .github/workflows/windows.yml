name: Studio desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check Windows source launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: Run-PrismLight.cmd --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python build.py
      - name: Check packaged demo startup
        shell: python
        run: |
          import os, subprocess, sys
          env = dict(os.environ, QT_QPA_PLATFORM='offscreen')
          exe = 'dist/PrismLight/PrismLight.exe' if sys.platform == 'win32' else 'dist/PrismLight/PrismLight'
          subprocess.run([exe, '--smoke-test'], env=env, timeout=30, check=True)
      - name: Check bundled Linux hardware engine lifecycle
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, subprocess, tempfile
          env = dict(os.environ, QT_QPA_PLATFORM='offscreen')
          with tempfile.TemporaryDirectory() as config:
              subprocess.run(['dist/PrismLight/PrismLight', '--hardware-smoke-test', '--hardware-config', config], env=env, timeout=60, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: PrismLight-Studio-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
